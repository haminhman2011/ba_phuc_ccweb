<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quản lý nhân viên</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container my-4">

   <h2 class="mb-4 text-center">Quản lý nhân viên</h2>
   <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <span id="formTitle">Thêm nhân viên</span>
        </div>
        <div class="card-body">

            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Tên nhân viên</label>
                    <input type="text" id="pName" class="form-control" placeholder="Nhập tên...">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Email</label>
                    <input type="text" id="email" class="form-control" placeholder="Nhập email....">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Dự án</label>
                    <select id="id_project" class="form-select">
                        <option value="">-- Chọn dự án --</option>
                    </select>
                </div>
                <div class="col-md-3">
	                <button class="btn btn-success" onclick="createStaff()">Thêm mới</button>
	            </div>
            </div>
        </div>
    </div>
   <div class="card shadow-sm">
        <div class="card-body">

            <div class="row mb-3">
                <div class="col-md-4">
                	<lable>Danh sách dự án</lable>
                    <select id="projectFilter" class="form-select" onchange="filterProjects()">
                        <option value="">-- Tất cả --</option>
                    </select>
                </div>
            </div>

            <table class="table table-striped table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th style="width:60px">STT</th>
                        <th>Tên nhân viên</th>
                        <th>Email</th>
                        <th style="width:100px">Dự án</th>
                    </tr>
                </thead>
                <tbody id="staffTableBody"></tbody>
            </table>

        </div>
    </div>
 </div>
 </body>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allStaffs = [];
function loadStaffs() {
    fetch('/api/staffs')
        .then(res => res.json())
        .then(staffs => {
        	
        	renderTable(staffs)
        	allStaffs = staffs;
           
        })
        .catch(err => {
           
            document.getElementById('staffTableBody').innerHTML =
                '<tr><td colspan="4" class="text-danger text-center">Không tải được dữ liệu</td></tr>';
        });
}
function renderTable(staffs) {
    let html = '';
    if (staffs.length === 0) {
        html = '<tr><td colspan="4" class="text-center text-muted">Không có nhân viên</td></tr>';
    } else {
    	staffs.forEach(p => {
            html += '<tr>' +
                '<td>' + p.id + '</td>' +
                '<td>' + p.name + '</td>' +
                '<td>' + p.email + '</td>' +
                '<td>' + p.projectName + '</td>' +
                '</tr>';
        });
    }
    document.getElementById('staffTableBody').innerHTML = html;
}
function loadProjects(projectId = '') {
    fetch('/api/projects')
        .then(res => res.json())
        .then(projects => {
        	
        	if(projectId === '') {
        		const projectFilter = document.getElementById('projectFilter');
        	
                
        		projects.forEach(c => {
                    const opt1 = document.createElement('option');
                    opt1.value = c.id;
                    opt1.textContent = c.name;
                    projectFilter.appendChild(opt1);
        

                });
               
        	} else {
        		projects.forEach(c => {
        			if(c.id == projectId) {
        				let html = '';
        				c.staffs.forEach(p => {
        					html += '<tr>' +
                            '<td>' + p.id + '</td>' +
                            '<td>' + p.name + '</td>' +
                            '<td>' + p.email + '</td>' +
                            '<td>' + p.projectName + '</td>' +
                            '</tr>';
        				})
        				document.getElementById('staffTableBody').innerHTML = html;
        			}
        		})
        	}
            
        })
        .catch(err => console.log(err));
}
function filterProjects() {
    const selected = document.getElementById('projectFilter').value;
    if (selected === '') {
    	loadStaffs();
    } else {
        const projectId = selected;
        loadProjects(projectId)
       
    }
}
function loadSelectchooseAddProject() {
    fetch('/api/projects')
        .then(res => res.json())
        .then(projects => {
        	const id_project = document.getElementById('id_project');
        	projects.forEach(c => {
                const opt2 = document.createElement('option');
                opt2.value = c.id;
                opt2.textContent = c.name;
                id_project.appendChild(opt2);
            });
        })
        .catch(err => console.log(err));
}
function createStaff() {
	 const name = document.getElementById('pName').value.trim();
       const email = document.getElementById('email').value;
       const idProject = Number(document.getElementById('id_project').value);

       if (name === '') {
           alert('Vui lòng nhập tên');
           return;
       }
       if (email === '') {
           alert('Vui lòng nhập email');
           return;
       }

       if (idProject === 0) {
           alert('Vui lòng chọn dự án');
           return;
       }

       const sp = { name: name, email: email, projectId: idProject };

       fetch('/api/staffs', {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify(sp)
       })
       .then(res => res.json())
       .then(() => {
       	loadStaffs();
      
        document.getElementById('pName').value = '';
        document.getElementById('email').value = '';
        document.getElementById('id_project').value = '';
       })
       .catch(err => console.error('Lỗi khi thêm API:', err));
}
//=====================================================================
document.addEventListener('DOMContentLoaded', function () {
	loadProjects();
	loadSelectchooseAddProject();
    loadStaffs();
	
});
</script>
 </html>
