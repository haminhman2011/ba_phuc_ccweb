<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="ctx" th:content="@{/}">
    <title layout:title-pattern="$CONTENT_TITLE · Đăng ký môn học">Đăng ký môn học</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>

        <main class="app-content">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}"><i class="bi bi-house-door me-1"></i>Trang chủ</a></li>
                    <th:block layout:fragment="breadcrumb"></th:block>
                </ol>
            </nav>

            <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>

            <div layout:fragment="content"></div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/confirm-modal :: confirm-modal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
