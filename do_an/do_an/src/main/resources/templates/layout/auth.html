<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · Đăng ký môn học">Đăng ký môn học</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
        <div class="col-lg-6 d-none d-lg-flex auth-hero">
            <div class="auth-logo"><i class="bi bi-mortarboard-fill"></i></div>
            <h1 class="display-6 fw-bold mb-3">Hệ thống đăng ký môn học</h1>
            <p class="lead mb-5" style="opacity:.8">
                Đăng ký, hủy đăng ký môn học và tra cứu kết quả học tập trực tuyến, nhanh chóng và chính xác.
            </p>
            <div class="auth-features">
                <div><i class="bi bi-journal-check"></i><span>Đăng ký môn học theo từng học kỳ</span></div>
                <div><i class="bi bi-shield-check"></i><span>Tự kiểm tra môn mở, trùng môn và số tín chỉ</span></div>
                <div><i class="bi bi-graph-up-arrow"></i><span>Xem điểm và điểm trung bình tích lũy</span></div>
            </div>
        </div>
        <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-4">
            <div class="w-100 auth-panel">
                <th:block layout:fragment="content"></th:block>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
