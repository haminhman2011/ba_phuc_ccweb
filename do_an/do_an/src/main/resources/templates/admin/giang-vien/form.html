<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${form.editMode} ? 'Sửa giảng viên' : 'Thêm giảng viên'">Thêm giảng viên</title>
</head>
<body>
<th:block layout:fragment="page-title"><th:block th:text="${form.editMode} ? 'Sửa giảng viên' : 'Thêm giảng viên'"></th:block></th:block>
<th:block layout:fragment="breadcrumb">
    <li class="breadcrumb-item">Quản lý</li>
    <li class="breadcrumb-item"><a th:href="@{/admin/giang-vien}">Giảng viên</a></li>
    <li class="breadcrumb-item active" aria-current="page" th:text="${form.editMode} ? 'Sửa' : 'Thêm mới'">Thêm mới</li>
</th:block>

<div layout:fragment="content">
    <div class="card" style="max-width: 900px">
        <div class="card-header">
            <h2 class="card-title-sm">
                <i class="bi bi-person-badge me-2"></i><span th:text="${form.editMode} ? 'Cập nhật thông tin giảng viên' : 'Thông tin giảng viên mới'"></span>
            </h2>
        </div>
        <form th:action="@{/admin/giang-vien/luu}" th:object="${form}" method="post" novalidate>
            <input type="hidden" th:field="*{editMode}">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="maGV" class="form-label required">Mã GV</label>
                        <input type="text" th:field="*{maGV}" class="form-control" th:errorclass="is-invalid"
                               maxlength="10" placeholder="VD: GV05" data-uppercase th:readonly="*{editMode}">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('maGV')}" th:errors="*{maGV}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="hoTen" class="form-label required">Họ tên</label>
                        <input type="text" th:field="*{hoTen}" class="form-control" th:errorclass="is-invalid" maxlength="50">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="hocVi" class="form-label">Học vị</label>
                        <select th:field="*{hocVi}" class="form-select" th:errorclass="is-invalid">
                            <option value="">-- Chọn học vị --</option>
                            <option th:each="hv : ${hocVis}" th:value="${hv}" th:text="${hv}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('hocVi')}" th:errors="*{hocVi}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="maKhoa" class="form-label required">Khoa</label>
                        <select th:field="*{maKhoa}" class="form-select" th:errorclass="is-invalid">
                            <option value="">-- Chọn khoa --</option>
                            <option th:each="k : ${khoas}" th:value="${k.maKhoa}" th:text="${k.tenKhoa}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('maKhoa')}" th:errors="*{maKhoa}"></div>
                    </div>
                    <div class="col-12" th:unless="*{editMode}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{taoTaiKhoan}">
                            <label class="form-check-label" th:for="${#ids.prev('taoTaiKhoan')}">
                                Tạo tài khoản đăng nhập
                                <span class="text-muted small">(tên đăng nhập là mã GV viết thường, mật khẩu 123456)</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-end gap-2 py-3">
                <a th:href="@{/admin/giang-vien}" class="btn btn-secondary">Hủy</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Lưu</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
