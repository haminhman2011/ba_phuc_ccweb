<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Quản lý môn học</title>
</head>
<body>
<th:block layout:fragment="page-title">Quản lý môn học</th:block>
<th:block layout:fragment="breadcrumb">
    <li class="breadcrumb-item">Quản lý</li>
    <li class="breadcrumb-item active" aria-current="page">Môn học</li>
</th:block>

<div layout:fragment="content">
    <div class="card table-card">
        <div class="card-body border-bottom">
            <form class="toolbar" th:action="@{/admin/mon-hoc}" method="get">
                <div class="toolbar-filters">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="search" name="q" th:value="${q}" class="form-control"
                               placeholder="Tìm theo mã hoặc tên…" aria-label="Tìm kiếm">
                    </div>
                    <select name="maKhoa" class="form-select" data-auto-submit aria-label="Lọc theo khoa">
                        <option value="">Tất cả khoa</option>
                        <option th:each="k : ${khoas}" th:value="${k.maKhoa}" th:text="${k.tenKhoa}"
                                th:selected="${k.maKhoa == maKhoa}"></option>
                    </select>
                    <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-funnel me-1"></i>Lọc</button>
                </div>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#monHocModal"
                        data-mode="add"><i class="bi bi-plus-lg me-1"></i>Thêm mới</button>
            </form>
        </div>

        <th:block th:if="${#lists.isEmpty(monHocs)}">
            <div th:replace="~{fragments/common :: empty(${#strings.isEmpty(q) and #strings.isEmpty(maKhoa)} ? 'Chưa có dữ liệu' : 'Không tìm thấy môn học phù hợp.', null, '#monHocModal')}"></div>
        </th:block>

        <div th:unless="${#lists.isEmpty(monHocs)}" class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th class="col-stt">STT</th>
                    <th>Mã môn</th>
                    <th>Tên môn</th>
                    <th class="text-center">Số TC</th>
                    <th>Khoa phụ trách</th>
                    <th>Trạng thái <span th:text="${hocKyHienTai}"></span></th>
                    <th class="col-actions">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m, st : ${monHocs}">
                    <td class="col-stt" th:text="${st.count}">1</td>
                    <td class="ma" th:text="${m.maMH}"></td>
                    <td th:text="${m.tenMH}"></td>
                    <td class="text-center" th:text="${m.soTinChi}"></td>
                    <td th:text="${m.khoa.tenKhoa}"></td>
                    <td>
                        <span th:if="${monDangMo.contains(m.maMH)}" class="badge badge-soft-success">
                            <i class="bi bi-circle-fill me-1" style="font-size:.5em; vertical-align:middle"></i>Đang mở</span>
                        <span th:unless="${monDangMo.contains(m.maMH)}" class="badge badge-soft-secondary">Chưa mở</span>
                    </td>
                    <td class="col-actions">
                        <button type="button" class="btn btn-sm btn-outline-primary btn-icon" title="Sửa môn học"
                                data-tooltip data-bs-toggle="modal" data-bs-target="#monHocModal" data-mode="edit"
                                th:data-ma-m-h="${m.maMH}" th:data-ten-m-h="${m.tenMH}"
                                th:data-so-tin-chi="${m.soTinChi}" th:data-ma-khoa="${m.khoa.maKhoa}">
                            <i class="bi bi-pencil"></i></button>
                        <button type="button" class="btn btn-sm btn-outline-danger btn-icon" title="Xóa môn học"
                                data-tooltip
                                th:data-confirm-action="@{/admin/mon-hoc/{ma}/xoa(ma=${m.maMH})}"
                                data-confirm-message="Bạn có chắc muốn xóa môn học"
                                th:data-confirm-target="|${m.maMH} – ${m.tenMH}|">
                            <i class="bi bi-trash"></i></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal thêm/sửa môn học -->
    <div class="modal fade" id="monHocModal" tabindex="-1" aria-labelledby="monHocModalTitle" aria-hidden="true"
         data-form-modal data-title-add="Thêm môn học" data-title-edit="Sửa môn học"
         th:data-open-on-load="${openModal != null}">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/admin/mon-hoc/luu}" th:object="${form}" method="post" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title" id="monHocModalTitle"
                            th:text="*{editMode} ? 'Sửa môn học' : 'Thêm môn học'">Thêm môn học</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <th:block th:replace="~{fragments/alerts :: modal-error}"></th:block>
                        <input type="hidden" th:field="*{editMode}">
                        <div class="row g-3">
                            <div class="col-sm-5">
                                <label for="maMH" class="form-label required">Mã môn</label>
                                <input type="text" th:field="*{maMH}" class="form-control" th:errorclass="is-invalid"
                                       maxlength="10" placeholder="VD: CSDL" data-pk data-uppercase
                                       th:readonly="*{editMode}">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('maMH')}" th:errors="*{maMH}"></div>
                            </div>
                            <div class="col-sm-7">
                                <label for="soTinChi" class="form-label required">Số tín chỉ</label>
                                <input type="number" th:field="*{soTinChi}" class="form-control" th:errorclass="is-invalid"
                                       min="1" max="6" step="1" data-default="3">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('soTinChi')}" th:errors="*{soTinChi}"></div>
                            </div>
                            <div class="col-12">
                                <label for="tenMH" class="form-label required">Tên môn</label>
                                <input type="text" th:field="*{tenMH}" class="form-control" th:errorclass="is-invalid"
                                       maxlength="100">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('tenMH')}" th:errors="*{tenMH}"></div>
                            </div>
                            <div class="col-12">
                                <label for="maKhoa" class="form-label required">Khoa phụ trách</label>
                                <select th:field="*{maKhoa}" class="form-select" th:errorclass="is-invalid"
                                        th:data-default="${maKhoa}">
                                    <option value="">-- Chọn khoa --</option>
                                    <option th:each="k : ${khoas}" th:value="${k.maKhoa}" th:text="${k.tenKhoa}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('maKhoa')}" th:errors="*{maKhoa}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
