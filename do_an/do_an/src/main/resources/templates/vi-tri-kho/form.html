<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quản lý kho lạnh - Thông tin vị trí</title>
    <meta charset="utf-8">
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>

<body>
    <div class="container-fluid position-relative bg-white d-flex p-0">
        <div th:replace="~{fragments/layout :: spinner}"></div>
        <div th:replace="~{fragments/layout :: sidebar('vi-tri-kho')}"></div>

        <div class="content">
            <div th:replace="~{fragments/layout :: navbar}"></div>

            <div class="container-fluid pt-4 px-4">
                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="bg-light rounded p-4">
                            <h6 class="mb-4"
                                th:text="${viTriKho.id == null} ? 'Thêm vị trí kho' : 'Sửa vị trí kho'">Vị trí kho</h6>

                            <form th:action="@{/vi-tri-kho/luu}" th:object="${viTriKho}" method="post" novalidate>
                                <input type="hidden" th:field="*{id}">

                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label">Mã vị trí <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{maViTri}"
                                               th:classappend="${#fields.hasErrors('maViTri')} ? 'is-invalid'"
                                               th:readonly="${viTriKho.id != null}"
                                               placeholder="VD: VT04">
                                        <div class="text-danger small mt-1"
                                             th:if="${#fields.hasErrors('maViTri')}" th:errors="*{maViTri}"></div>
                                        <div class="form-text" th:if="${viTriKho.id != null}">
                                            Mã vị trí không sửa được sau khi đã tạo
                                        </div>
                                    </div>

                                    <div class="col-md-8">
                                        <label class="form-label">Tên vị trí <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{tenViTri}"
                                               th:classappend="${#fields.hasErrors('tenViTri')} ? 'is-invalid'"
                                               placeholder="VD: Kho B - Kệ 2">
                                        <div class="text-danger small mt-1"
                                             th:if="${#fields.hasErrors('tenViTri')}" th:errors="*{tenViTri}"></div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label">Nhiệt độ hiện tại (°C)</label>
                                        <input type="number" step="0.01" class="form-control" th:field="*{nhietDoHienTai}"
                                               th:classappend="${#fields.hasErrors('nhietDoHienTai')} ? 'is-invalid'"
                                               placeholder="VD: -18">
                                        <div class="text-danger small mt-1"
                                             th:if="${#fields.hasErrors('nhietDoHienTai')}" th:errors="*{nhietDoHienTai}"></div>
                                        <div class="form-text">Cho phép số âm</div>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label">Mô tả</label>
                                        <textarea class="form-control" rows="3" th:field="*{moTa}"
                                                  th:classappend="${#fields.hasErrors('moTa')} ? 'is-invalid'"></textarea>
                                        <div class="text-danger small mt-1"
                                             th:if="${#fields.hasErrors('moTa')}" th:errors="*{moTa}"></div>
                                    </div>
                                </div>

                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary px-4">Lưu</button>
                                    <a th:href="@{/vi-tri-kho}" class="btn btn-outline-secondary px-4">Huỷ</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: footer}"></div>
        </div>

        <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    </div>

    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>

</html>
