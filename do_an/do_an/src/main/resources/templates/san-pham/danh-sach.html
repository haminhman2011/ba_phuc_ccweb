<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quản lý kho lạnh - Sản phẩm</title>
    <meta charset="utf-8">
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>

<body>
    <div class="container-fluid position-relative bg-white d-flex p-0">
        <div th:replace="~{fragments/layout :: spinner}"></div>
        <div th:replace="~{fragments/layout :: sidebar('san-pham')}"></div>

        <div class="content">
            <div th:replace="~{fragments/layout :: navbar}"></div>

            <div class="container-fluid pt-4 px-4">

                <!-- Thông báo thành công / lỗi nghiệp vụ -->
                <div class="alert alert-success alert-dismissible fade show" th:if="${thongBao}">
                    <span th:text="${thongBao}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div class="alert alert-danger alert-dismissible fade show" th:if="${loi}">
                    <span th:text="${loi}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="bg-light rounded p-4">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h6 class="mb-0">Danh sách sản phẩm</h6>
                        <a th:href="@{/san-pham/them}" class="btn btn-primary btn-sm">
                            <i class="fa fa-plus me-1"></i> Thêm mới
                        </a>
                    </div>

                    <!-- Ô tìm kiếm theo mã hoặc tên -->
                    <form th:action="@{/san-pham}" method="get" class="row g-2 mb-4">
                        <div class="col-md-5">
                            <input type="text" name="tuKhoa" class="form-control"
                                   th:value="${tuKhoa}" placeholder="Tìm theo mã hoặc tên sản phẩm">
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary">Tìm</button>
                        </div>
                        <div class="col-auto" th:if="${tuKhoa != null and !tuKhoa.isBlank()}">
                            <a th:href="@{/san-pham}" class="btn btn-outline-secondary">Bỏ lọc</a>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle mb-0">
                            <thead>
                                <tr class="text-dark">
                                    <th scope="col">Mã SP</th>
                                    <th scope="col">Tên sản phẩm</th>
                                    <th scope="col">ĐVT</th>
                                    <th scope="col">Nhiệt độ (°C)</th>
                                    <th scope="col" class="text-end">Tồn tối thiểu</th>
                                    <th scope="col">Trạng thái</th>
                                    <th scope="col" class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="sp : ${danhSach}">
                                    <td th:text="${sp.maSanPham}">SP001</td>
                                    <td th:text="${sp.tenSanPham}">Tên</td>
                                    <td th:text="${sp.donViTinh}">kg</td>
                                    <td>
                                        <span th:if="${sp.nhietDoMin != null or sp.nhietDoMax != null}"
                                              th:text="${(sp.nhietDoMin != null ? sp.nhietDoMin : '?') + ' ... ' + (sp.nhietDoMax != null ? sp.nhietDoMax : '?')}">-18 ... -15</span>
                                        <span th:unless="${sp.nhietDoMin != null or sp.nhietDoMax != null}"
                                              class="text-muted">Chưa khai báo</span>
                                    </td>
                                    <td class="text-end" th:text="${sp.tonToiThieu}">0</td>
                                    <td>
                                        <span class="badge bg-success" th:if="${sp.trangThai == 1}">Đang kinh doanh</span>
                                        <span class="badge bg-secondary" th:unless="${sp.trangThai == 1}">Ngừng kinh doanh</span>
                                    </td>
                                    <td class="text-center text-nowrap">
                                        <a th:href="@{/san-pham/sua/{id}(id=${sp.id})}"
                                           class="btn btn-sm btn-primary">Sửa</a>

                                        <!-- Ngừng kinh doanh thay cho xoá cứng -->
                                        <form th:action="@{/san-pham/doi-trang-thai/{id}(id=${sp.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary"
                                                    th:text="${sp.trangThai == 1} ? 'Ngừng KD' : 'Mở bán'">Ngừng KD</button>
                                        </form>

                                        <form th:action="@{/san-pham/xoa/{id}(id=${sp.id})}"
                                              method="post" class="d-inline"
                                              th:data-ma="${sp.maSanPham}"
                                              onsubmit="return xacNhanXoa(this)">
                                            <button type="submit" class="btn btn-sm btn-danger">Xoá</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(danhSach)}">
                                    <td colspan="7" class="text-center text-muted py-4">
                                        Không tìm thấy sản phẩm nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: footer}"></div>
        </div>

        <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    </div>

    <th:block th:replace="~{fragments/layout :: js}"></th:block>

    <script>
    // Thymeleaf chặn việc nhét biến chuỗi thẳng vào onsubmit,
    // nên đẩy mã sản phẩm qua data-ma rồi đọc lại ở đây.
    function xacNhanXoa(form) {
        return confirm('Xoá sản phẩm ' + form.dataset.ma + ' ?');
    }
    </script>
</body>

</html>
