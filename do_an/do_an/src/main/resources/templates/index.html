<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Quản lý kho lạnh - Dashboard</title>
    <meta charset="utf-8">
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>

<body>
    <div class="container-fluid position-relative bg-white d-flex p-0">
        <div th:replace="~{fragments/layout :: spinner}"></div>
        <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>

        <div class="content">
            <div th:replace="~{fragments/layout :: navbar}"></div>

            <!-- ===== Thẻ thống kê ===== -->
            <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    <div class="col-sm-6 col-xl-3">
                        <a th:href="@{/ton-kho}" class="text-decoration-none text-dark">
                            <div class="bg-light rounded d-flex align-items-center justify-content-between p-4 h-100">
                                <i class="fa fa-box fa-3x text-primary"></i>
                                <div class="ms-3 text-end">
                                    <p class="mb-2">Tổng số sản phẩm</p>
                                    <h6 class="mb-0" th:text="${soSanPham}">0</h6>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-sm-6 col-xl-3">
                        <a th:href="@{/ton-kho}" class="text-decoration-none text-dark">
                            <div class="bg-light rounded d-flex align-items-center justify-content-between p-4 h-100">
                                <i class="fa fa-cubes fa-3x text-primary"></i>
                                <div class="ms-3 text-end">
                                    <p class="mb-2">Tổng số lượng tồn</p>
                                    <h6 class="mb-0" th:text="${tongTon}">0</h6>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-sm-6 col-xl-3">
                        <a th:href="@{/ton-kho(cheDoXem='CHI_TIET',tinhTrang='SAP_HET_HAN')}"
                           class="text-decoration-none text-dark">
                            <div class="bg-light rounded d-flex align-items-center justify-content-between p-4 h-100">
                                <i class="fa fa-clock fa-3x text-warning"></i>
                                <div class="ms-3 text-end">
                                    <p class="mb-2">Số lô sắp hết hạn</p>
                                    <h6 class="mb-0 text-warning" th:text="${soLoSapHetHan}">0</h6>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-sm-6 col-xl-3">
                        <a th:href="@{/ton-kho(cheDoXem='CHI_TIET',tinhTrang='QUA_HAN')}"
                           class="text-decoration-none text-dark">
                            <div class="bg-light rounded d-flex align-items-center justify-content-between p-4 h-100">
                                <i class="fa fa-exclamation-triangle fa-3x text-danger"></i>
                                <div class="ms-3 text-end">
                                    <p class="mb-2">Số lô quá hạn</p>
                                    <h6 class="mb-0 text-danger" th:text="${soLoQuaHan}">0</h6>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

            <!-- ===== Bảng lô cần ưu tiên xử lý ===== -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-light rounded p-4">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h6 class="mb-0">Lô cần ưu tiên xử lý</h6>
                        <a th:href="@{/canh-bao}">Xem cảnh báo</a>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle mb-0">
                            <thead>
                                <tr class="text-dark">
                                    <th>Mã lô</th>
                                    <th>Sản phẩm</th>
                                    <th>Vị trí</th>
                                    <th>Hạn dùng</th>
                                    <th class="text-end">Số còn tồn</th>
                                    <th class="text-end">Số ngày còn lại</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="d : ${loCanUuTien}"
                                    th:classappend="${d.quaHan} ? 'table-danger' : 'table-warning'">
                                    <td th:text="${d.maLo}">LO-001</td>
                                    <td th:text="${d.tenSanPham}">Tên</td>
                                    <td>
                                        <span th:if="${d.tenViTri != null}" th:text="${d.tenViTri}">Kho A</span>
                                        <span th:unless="${d.tenViTri != null}" class="text-muted">Chưa xếp</span>
                                    </td>
                                    <td th:text="${#temporals.format(d.hanSuDung, 'dd/MM/yyyy')}">01/01/2027</td>
                                    <td class="text-end fw-bold" th:text="${d.soLuongTon}">0</td>
                                    <td class="text-end">
                                        <span class="text-danger fw-bold" th:if="${d.quaHan}"
                                              th:text="'Quá hạn ' + ${-d.soNgayConLai} + ' ngày'">Quá hạn</span>
                                        <span th:unless="${d.quaHan}" th:text="${d.soNgayConLai} + ' ngày'">0 ngày</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(loCanUuTien)}">
                                    <td colspan="6" class="text-center text-muted py-4">
                                        Không có lô nào sắp hết hạn hay quá hạn
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3" sec:authorize="hasRole('THU_KHO')">
                        <a th:href="@{/phieu-xuat}" class="btn btn-sm btn-outline-danger">
                            Đi tới Xuất kho để xử lý
                        </a>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: footer}"></div>
        </div>

        <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    </div>

    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>

</html>
