<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Nhập điểm</title>
</head>
<body>
<th:block layout:fragment="page-title">Nhập điểm</th:block>
<th:block layout:fragment="breadcrumb">
    <li class="breadcrumb-item"><a th:href="@{/gv/phan-cong(hocKy=${hocKy})}">Môn được phân công</a></li>
    <li class="breadcrumb-item active" aria-current="page" th:text="${monHoc.maMH}">CSDL</li>
</th:block>

<div layout:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
        <div>
            <h2 class="page-heading">
                <span th:text="${monHoc.tenMH}">Cơ sở dữ liệu</span> (<span th:text="${monHoc.maMH}">CSDL</span>)
            </h2>
            <div class="text-muted">
                Học kỳ <span th:text="${hocKy}"></span> · <span th:text="${monHoc.soTinChi}"></span> tín chỉ
                · <span th:text="${#lists.size(rows)}">0</span> sinh viên
            </div>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/gv/phan-cong(hocKy=${hocKy})}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Quay lại</a>
            <a th:if="${!#lists.isEmpty(rows)}" th:href="@{/gv/nhap-diem/{ma}/csv(ma=${monHoc.maMH}, hocKy=${hocKy})}"
               class="btn btn-outline-success"><i class="bi bi-filetype-csv me-1"></i>Xuất CSV</a>
        </div>
    </div>

    <div id="unsavedWarning" class="alert alert-warning py-2 d-flex align-items-center gap-2 d-none" role="status">
        <i class="bi bi-exclamation-circle"></i>Có thay đổi chưa lưu
    </div>

    <div class="card" th:if="${#lists.isEmpty(rows)}">
        <div th:replace="~{fragments/common :: empty-text('Chưa có sinh viên nào đăng ký môn này trong học kỳ.', 'bi-people')}"></div>
    </div>

    <form th:unless="${#lists.isEmpty(rows)}" th:action="@{/gv/nhap-diem/{ma}(ma=${monHoc.maMH})}" method="post"
          data-diem-form th:data-dirty="${!#lists.isEmpty(oLoi)}" novalidate>
        <input type="hidden" name="hocKy" th:value="${hocKy}">
        <div class="card table-card" style="overflow: visible">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th class="col-stt">STT</th>
                        <th>Mã SV</th>
                        <th>Họ tên</th>
                        <th>Lớp</th>
                        <th>Ngày đăng ký</th>
                        <th class="text-center" style="width: 130px">Điểm</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r, st : ${rows}">
                        <td class="col-stt" th:text="${st.count}">1</td>
                        <td class="ma" th:text="${r.maSV}"></td>
                        <td class="fw-medium" th:text="${r.hoTen}"></td>
                        <td th:text="${r.tenLop}"></td>
                        <td th:text="${r.ngayDangKy != null} ? ${#temporals.format(r.ngayDangKy, 'dd/MM/yyyy')} : '—'"></td>
                        <td class="text-center">
                            <input type="hidden" th:name="|items[${st.index}].maSV|" th:value="${r.maSV}">
                            <input type="number" class="form-control form-control-sm diem-input"
                                   th:classappend="${r.loi} ? 'is-invalid'"
                                   th:name="|items[${st.index}].diem|" th:value="${r.diem}"
                                   min="0" max="10" step="0.1" inputmode="decimal"
                                   th:aria-label="|Điểm của ${r.hoTen}|">
                            <div class="invalid-feedback">Điểm phải từ 0 đến 10.</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="sticky-actions">
                <div>
                    Đã nhập <strong id="daNhapCount" th:text="${daNhap}">0</strong>/<strong th:text="${#lists.size(rows)}">0</strong> sinh viên
                    <span class="text-muted small ms-2 d-none d-md-inline">Để trống nếu chưa có điểm.</span>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Lưu điểm</button>
            </div>
        </div>
    </form>
</div>
</body>
</html>
