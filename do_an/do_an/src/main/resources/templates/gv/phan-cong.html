<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Môn được phân công</title>
</head>
<body>
<th:block layout:fragment="page-title">Môn được phân công</th:block>
<th:block layout:fragment="breadcrumb">
    <li class="breadcrumb-item">Giảng viên</li>
    <li class="breadcrumb-item active" aria-current="page">Môn được phân công</li>
</th:block>

<div layout:fragment="content">
    <form th:action="@{/gv/phan-cong}" method="get" class="mb-3">
        <label for="hocKy" class="form-label">Học kỳ</label>
        <select id="hocKy" name="hocKy" class="form-select" data-auto-submit style="max-width: 220px">
            <option th:each="hk : ${dsHocKy}" th:value="${hk}"
                    th:text="${hk == hocKyHienTai} ? |${hk} (hiện tại)| : ${hk}"
                    th:selected="${hk == hocKy}"></option>
        </select>
    </form>

    <div class="card" th:if="${#lists.isEmpty(cards)}">
        <div th:replace="~{fragments/common :: empty-text('Bạn chưa được phân công môn nào trong học kỳ này.', 'bi-journal-x')}"></div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" th:unless="${#lists.isEmpty(cards)}">
        <div class="col" th:each="c : ${cards}">
            <div class="card course-card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge badge-soft-navy fs-6" th:text="${c.maMH}">CSDL</span>
                        <span class="course-meta"><span th:text="${c.soTinChi}">3</span> tín chỉ</span>
                    </div>
                    <div class="course-name" th:text="${c.tenMH}">Cơ sở dữ liệu</div>
                    <div class="course-meta"><i class="bi bi-people me-1"></i>Sĩ số: <strong th:text="${c.siSo}">0</strong> sinh viên</div>
                    <div>
                        <div class="d-flex justify-content-between course-meta mb-1">
                            <span>Đã nhập điểm</span>
                            <span><strong th:text="${c.daNhapDiem}">0</strong>/<span th:text="${c.siSo}">0</span></span>
                        </div>
                        <div class="progress" role="progressbar" th:aria-valuenow="${c.phanTram}" aria-valuemin="0"
                             aria-valuemax="100" aria-label="Tiến độ nhập điểm">
                            <div class="progress-bar" th:classappend="${c.phanTram == 100} ? 'bg-success' : 'bg-accent'"
                                 th:style="|width: ${c.phanTram}%|"></div>
                        </div>
                    </div>
                    <a th:href="@{/gv/nhap-diem/{ma}(ma=${c.maMH}, hocKy=${hocKy})}" class="btn btn-primary mt-2">
                        <i class="bi bi-pencil-square me-1"></i>Danh sách &amp; nhập điểm</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
