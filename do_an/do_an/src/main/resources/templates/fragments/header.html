<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<header th:fragment="header" class="app-header">
    <button type="button" class="btn btn-light d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#appSidebar"
            aria-controls="appSidebar" aria-label="Mở menu">
        <i class="bi bi-list fs-5"></i>
    </button>

    <h1 class="page-title"><th:block layout:fragment="page-title">Trang chủ</th:block></h1>

    <div class="ms-auto d-flex align-items-center gap-2 gap-md-3">
        <span class="hoc-ky-badge d-none d-sm-inline-flex"
              th:title="${thongTinHocKyHienTai != null} ? |${#temporals.format(thongTinHocKyHienTai.ngayBatDau, 'dd/MM/yyyy')} – ${#temporals.format(thongTinHocKyHienTai.ngayKetThuc, 'dd/MM/yyyy')}|">
            <i class="bi bi-calendar3"></i>Học kỳ: <strong th:text="${hocKyHienTai}">HK1-2026</strong>
            <span th:if="${thongTinHocKyHienTai != null and thongTinHocKyHienTai.dangDienRa(#temporals.createToday())}"
                  class="d-none d-xl-inline"
                  th:text="|· tuần ${thongTinHocKyHienTai.tuanCua(#temporals.createToday())}/${thongTinHocKyHienTai.soTuan}|"></span>
        </span>

        <div class="dropdown" th:if="${currentUser != null}">
            <button class="user-menu dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="avatar" th:text="${currentUser.initials}">A</span>
                <span class="d-none d-md-inline text-start">
                    <span class="user-name" th:text="${currentUser.hoTen}">Họ tên</span>
                    <span class="user-role" th:text="${currentUser.tenQuyen}">Vai trò</span>
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li class="d-md-none px-3 py-2">
                    <div class="fw-semibold" th:text="${currentUser.hoTen}"></div>
                    <small class="text-muted" th:text="${currentUser.tenQuyen}"></small>
                </li>
                <li class="d-md-none"><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" th:href="@{/doi-mat-khau}"><i class="bi bi-key me-2"></i>Đổi mật khẩu</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
