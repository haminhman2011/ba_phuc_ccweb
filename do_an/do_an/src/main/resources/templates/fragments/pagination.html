<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Phân trang dùng Page của Spring Data. Link giữ nguyên tham số tìm kiếm nhờ pageUrlPrefix
  (do GlobalModelAdvice tạo), ví dụ "/admin/sinh-vien?q=an&page=".
-->
<div th:fragment="pagination(page)" th:if="${page.totalElements > 0}"
     class="d-flex flex-wrap justify-content-between align-items-center gap-2 px-3 py-3 border-top"
     th:with="start=${page.number - 2 < 0 ? 0 : page.number - 2},
              end=${page.number + 2 > page.totalPages - 1 ? page.totalPages - 1 : page.number + 2}">
    <div class="text-muted small">
        Hiển thị <strong th:text="${page.number * page.size + 1}">1</strong>–<strong
            th:text="${page.number * page.size + page.numberOfElements}">10</strong>
        trên <strong th:text="${page.totalElements}">45</strong> bản ghi
    </div>
    <nav th:if="${page.totalPages > 1}" aria-label="Phân trang">
        <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{${pageUrlPrefix + (page.number - 1)}}" aria-label="Trang trước">&laquo;</a>
            </li>
            <li class="page-item" th:if="${start > 0}">
                <a class="page-link" th:href="@{${pageUrlPrefix + 0}}">1</a>
            </li>
            <li class="page-item disabled" th:if="${start > 1}"><span class="page-link">…</span></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(start, end)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{${pageUrlPrefix + i}}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item disabled" th:if="${end < page.totalPages - 2}"><span class="page-link">…</span></li>
            <li class="page-item" th:if="${end < page.totalPages - 1}">
                <a class="page-link" th:href="@{${pageUrlPrefix + (page.totalPages - 1)}}"
                   th:text="${page.totalPages}">9</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{${pageUrlPrefix + (page.number + 1)}}" aria-label="Trang sau">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
