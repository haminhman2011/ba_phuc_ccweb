<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Trạng thái rỗng: icon xám, dòng chữ và nút "+ Thêm mới" (link hoặc mở modal) -->
<div th:fragment="empty(text, addUrl, modalTarget)" class="empty-state">
    <i class="bi bi-inbox"></i>
    <p class="mb-3" th:text="${text}">Chưa có dữ liệu</p>
    <a th:if="${addUrl != null}" th:href="@{${addUrl}}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Thêm mới</a>
    <button th:if="${modalTarget != null}" type="button" class="btn btn-primary" data-bs-toggle="modal"
            th:data-bs-target="${modalTarget}" data-mode="add">
        <i class="bi bi-plus-lg me-1"></i>Thêm mới</button>
</div>

<!-- Trạng thái rỗng không có nút -->
<div th:fragment="empty-text(text, icon)" class="empty-state">
    <i class="bi" th:classappend="${icon}"></i>
    <p class="mb-0" th:text="${text}">Chưa có dữ liệu</p>
</div>

<!-- Thanh tiến độ tín chỉ: vàng khi còn ≤ 4 tín chỉ là đầy, đỏ khi đạt tối đa -->
<div th:fragment="tin-chi-progress(tong, toiDa)" class="progress" role="progressbar"
     th:aria-valuenow="${tong}" aria-valuemin="0" th:aria-valuemax="${toiDa}" aria-label="Tín chỉ đã đăng ký">
    <div class="progress-bar"
         th:classappend="${tong >= toiDa} ? 'bg-danger' : (${tong >= toiDa - 4} ? 'bg-warning' : 'bg-accent')"
         th:style="|width: ${tong >= toiDa ? 100 : tong * 100 / toiDa}%|"></div>
</div>

<!-- Điểm 1 chữ số thập phân, rỗng hiển thị "—" -->
<th:block th:fragment="diem(value)"><span
        th:text="${value != null} ? ${#numbers.formatDecimal(value, 1, 1, 'POINT')} : '—'">—</span></th:block>

</body>
</html>
