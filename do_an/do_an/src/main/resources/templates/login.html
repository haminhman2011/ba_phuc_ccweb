<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quản lý kho lạnh - Đăng nhập</title>
    <meta charset="utf-8">
    <!-- Chèn toàn bộ CSS dùng chung -->
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>

<body>
    <div class="container-fluid position-relative bg-white d-flex p-0">
        <!-- Spinner -->
        <div th:replace="~{fragments/layout :: spinner}"></div>

        <!-- Sign In Start -->
        <div class="container-fluid">
            <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                    <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <h3 class="text-primary mb-0"><i class="fa fa-snowflake me-2"></i>KHO LẠNH</h3>
                            <h3 class="mb-0">Đăng nhập</h3>
                        </div>

                        <!-- Thông báo sau khi đăng xuất -->
                        <div class="alert alert-success" th:if="${thongBao}" th:text="${thongBao}"></div>

                        <!-- Lỗi đăng nhập: sai tài khoản/mật khẩu hoặc tài khoản bị khoá -->
                        <div class="alert alert-danger" th:if="${loi}" th:text="${loi}"></div>

                        <!-- Spring Security nhận form ở POST /login.
                             Dùng th:action để Thymeleaf tự chèn CSRF token vào form. -->
                        <form th:action="@{/login}" method="post">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="tenDangNhap" name="tenDangNhap"
                                       placeholder="Tài khoản" required
                                       oninvalid="this.setCustomValidity('Vui lòng nhập tên đăng nhập')"
                                       oninput="this.setCustomValidity('')">
                                <label for="tenDangNhap">Tên đăng nhập</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="matKhau" name="matKhau"
                                       placeholder="Mật khẩu" required
                                       oninvalid="this.setCustomValidity('Vui lòng nhập mật khẩu')"
                                       oninput="this.setCustomValidity('')">
                                <label for="matKhau">Mật khẩu</label>
                            </div>
                            <button type="submit" class="btn btn-primary py-3 w-100 mb-0">Đăng nhập</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Sign In End -->
    </div>

    <!-- Chèn toàn bộ JS dùng chung, đặt trước </body> -->
    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>

</html>
