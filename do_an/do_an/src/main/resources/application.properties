spring.application.name=lab0910

# Session het han sau 30 phut khong thao tac
server.servlet.session.timeout=30m

# ===== Ket noi MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/quanly_kholanh?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate = chi kiem tra entity co khop voi DB da tao bang db/schema.sql (an toan cho do an).
# Doi thanh 'update' neu muon Hibernate tu sinh bang tu entity.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
# Tat cache de sua template xong F5 la thay ngay (chi dung khi dev)
spring.thymeleaf.cache=false

# ===== Canh bao han dung (UC6) =====
# So ngay truoc han dung thi bat dau canh bao "sap het han"
kholanh.canh-bao.nguong-ngay=7
# Lich chay job quet canh bao: 1 gio sang moi ngay
kholanh.canh-bao.lich=0 0 1 * * *
