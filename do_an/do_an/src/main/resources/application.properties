spring.application.name=dang-ky-mon-hoc

# Profile dev: hien dong "Tai khoan dung thu" o trang dang nhap. Xoa dong nay khi nop/trien khai.
spring.profiles.active=dev

# ===== Ket noi MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/dang_ky_mon_hoc?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=

# ===== JPA / Hibernate =====
# update: neu da import database/dang_ky_mon_hoc.sql thi Hibernate khong doi gi;
# neu chua import thi Hibernate tu tao bang va DataSeeder nap du lieu mau.
spring.jpa.hibernate.ddl-auto=update
# Giu nguyen ten bang/cot nhu thiet ke (KHOA, MaKhoa...), khong doi sang snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=SKIP
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Web =====
server.servlet.session.timeout=30m
server.error.include-stacktrace=never
spring.thymeleaf.cache=false

# ===== Tham so nghiep vu =====
# Hoc ky hien tai tinh theo ngay hom nay va thoi gian hoc ky (menu Hoc ky).
# Bo comment dong duoi neu muon co dinh mot hoc ky, vi du khi demo:
# app.hoc-ky-hien-tai=HK1-2026
app.tin-chi-toi-da=24
app.page-size=10
