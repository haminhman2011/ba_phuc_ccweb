# ===== Kết nối MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/quanly_kholanh?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate = chỉ kiểm tra khớp với DB đã tạo bằng schema.sql (an toàn cho đồ án).
# Đổi thành 'update' nếu muốn Hibernate tự sinh bảng từ entity.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
